<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bot-msg-bg: #334155;
            --user-msg-bg: #4f46e5;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-wrapper {
            width: 100%;
            max-width: 480px;
            height: 85vh;
            max-height: 750px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* 헤더 디자인 */
        .chat-header {
            padding: 20px;
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-main {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .header-info h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        /* 채팅 본문 */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 10px;
        }

        .msg-row {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: fadeIn 0.3s ease-in-out;
        }

        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.bot {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .msg-row.bot .msg-avatar {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
        }

        .msg-row.user .msg-avatar {
            background-color: var(--border-color);
            color: var(--text-muted);
        }

        .msg-content {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg-row.bot .msg-content {
            background-color: var(--bot-msg-bg);
            color: var(--text-main);
            border-top-left-radius: 4px;
        }

        .msg-row.user .msg-content {
            background-color: var(--user-msg-bg);
            color: white;
            border-top-right-radius: 4px;
        }

        /* 입력 창 */
        .input-container {
            padding: 16px 20px;
            background-color: rgba(30, 41, 59, 0.8);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-container input:focus {
            border-color: var(--primary);
        }

        .input-container button {
            width: 46px;
            height: 46px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .input-container button:hover {
            background-color: var(--primary-hover);
        }

        .input-container button:active {
            transform: scale(0.95);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="chat-wrapper">
    <div class="chat-header">
        <div class="avatar-main">
            <i class="fa-solid me-0 fa-robot"></i>
        </div>
        <div class="header-info">
            <h2>AI 개인 비서</h2>
            <div class="status-indicator">
                <span class="dot"></span> 온라인
            </div>
        </div>
    </div>

    <div class="chat-box" id="chat-box">
        <div class="msg-row bot">
            <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="msg-content">안녕하세요! 든든한 AI 개인 비서입니다. 무엇이든 물어보세요! 😊</div>
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="user-input" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button type="button" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script>
    // 💡 Render 백엔드 주소를 입력하세요 (끝에 / 없이 작성)
    const BACKEND_URL = "https://my-ai-chat-bot.onrender.com";

    function appendMessage(text, side) {
        const chatBox = document.getElementById("chat-box");
        
        const rowDiv = document.createElement("div");
        rowDiv.className = `msg-row ${side}`;

        const avatarDiv = document.createElement("div");
        avatarDiv.className = "msg-avatar";
        avatarDiv.innerHTML = side === "bot" ? '<i class="fa-solid fa-robot"></i>' : '<i class="fa-solid fa-user"></i>';

        const contentDiv = document.createElement("div");
        contentDiv.className = "msg-content";
        contentDiv.innerText = text;

        rowDiv.appendChild(avatarDiv);
        rowDiv.appendChild(contentDiv);
        chatBox.appendChild(rowDiv);

        chatBox.scrollTop = chatBox.scrollHeight;
        return contentDiv;
    }

    async function sendMessage() {
        const input = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const message = input.value.trim();

        if (!message) return;

        appendMessage(message, "user");
        input.value = "";
        const loadingDiv = appendMessage("답변을 생각 중이에요... 💭", "bot");

        try {
            const response = await fetch(`${BACKEND_URL}/api/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();

            if (response.ok) {
                loadingDiv.innerText = data.answer;
            } else {
                loadingDiv.innerText = "❌ 에러가 발생했습니다: " + (data.detail || "오류 발생");
            }
        } catch (error) {
            loadingDiv.innerText = "❌ 서버와 연결할 수 없습니다. (Render 서버가 준비 중일 수 있으니 30초 후 다시 시도해 주세요)";
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
