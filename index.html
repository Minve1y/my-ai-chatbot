<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-chat: #0f172a;
            --bg-card: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .btn-new-chat {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .room-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .room-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
        }
        .room-item:hover, .room-item.active { background-color: var(--bg-card); color: var(--text-main); }

        .main-chat { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        .chat-header {
            padding: 16px 20px;
            background-color: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toggle-sidebar { display: none; background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

        .msg-row { display: flex; gap: 12px; max-width: 80%; }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot { align-self: flex-start; }

        .msg-content {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .msg-row.bot .msg-content { background-color: var(--bg-card); }
        .msg-row.user .msg-content { background-color: var(--primary); }

        .input-container { padding: 16px 20px; background-color: var(--bg-sidebar); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .input-container input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: white; outline: none; }
        .input-container button { width: 44px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .input-container button:disabled { background: var(--bg-card); cursor: not-allowed; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .toggle-sidebar { display: block; }
        }
        .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
        }
        .room-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .room-actions {
            display: none;
            gap: 8px;
        }
        .room-item:hover .room-actions {
            display: flex;
        }
        .room-actions i {
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
        }
        .room-actions i:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button type="button" class="btn-new-chat" onclick="createNewRoom()"><i class="fa-solid fa-plus"></i> 새 대화 시작</button>
        </div>
        <div class="room-list" id="room-list"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <button type="button" class="toggle-sidebar" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h3 id="current-room-title">대화방을 준비 중입니다...</h3>
        </div>

        <div class="chat-box" id="chat-box"></div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="메시지를 입력하세요..." onkeydown="handleKeyDown(event)">
            <button type="button" id="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

<script>
    // 💡 Render 백엔드 주소를 입력하세요 (끝에 / 없이 작성)
    const BACKEND_URL = "https://my-ai-chat-bot.onrender.com"; 
    
    let userId = localStorage.getItem("chat_user_id") || "user_" + Math.random().toString(36).substr(2, 9);
    localStorage.setItem("chat_user_id", userId);

    let currentRoomId = null;

    window.onload = async () => {
        await loadRooms();
    };

    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
    }

    // 엔터키 처리 함수 (Enter 키 전송 지원)
    function handleKeyDown(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault(); // 기본 줄바꿈 동작 방지
            sendMessage();
        }
    }

    // 채팅방 목록 로드 시 수정/삭제 아이콘 함께 생성
    async function loadRooms() {
        try {
            const res = await fetch(`${BACKEND_URL}/api/rooms/${userId}`);
            const data = await res.json();
            const roomList = document.getElementById("room-list");
            roomList.innerHTML = "";
    
            if (data.rooms && data.rooms.length > 0) {
                data.rooms.forEach(room => {
                    const div = document.createElement("div");
                    div.className = `room-item ${room.id === currentRoomId ? 'active' : ''}`;
                    
                    div.innerHTML = `
                        <span class="room-title-text">${room.title}</span>
                        <div class="room-actions">
                            <i class="fa-solid fa-pen" onclick="renameRoom(event, '${room.id}', '${room.title}')" title="이름 변경"></i>
                        </div>
                    `;
                    
                    div.onclick = (e) => {
                        // 아이콘 클릭 시에는 채팅방 이동 동작을 방지
                        if (!e.target.classList.contains('fa-pen')) {
                            selectRoom(room.id, room.title);
                        }
                    };
                    roomList.appendChild(div);
                });
    
                if (!currentRoomId) {
                    selectRoom(data.rooms[0].id, data.rooms[0].title);
                }
            } else {
                await createNewRoom();
            }
        } catch (e) {
            console.error("채팅방 목록 로드 실패:", e);
        }
    }
    
    // 이름 변경 프롬프트 및 API 호출 함수
    async function renameRoom(event, roomId, currentTitle) {
        event.stopPropagation(); // 부모 div 클릭 이벤트 방지
        const newTitle = prompt("새 대화방 이름을 입력하세요:", currentTitle);
        
        if (!newTitle || newTitle.trim() === "" || newTitle === currentTitle) return;
    
        try {
            const res = await fetch(`${BACKEND_URL}/api/rooms/${roomId}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: newTitle.trim() })
            });
    
            if (res.ok) {
                if (roomId === currentRoomId) {
                    document.getElementById("current-room-title").innerText = newTitle.trim();
                }
                await loadRooms();
            } else {
                alert("이름 변경에 실패했습니다.");
            }
        } catch (e) {
            alert("서버 통신 오류가 발생했습니다.");
        }
    }

    async function createNewRoom() {
        try {
            const res = await fetch(`${BACKEND_URL}/api/rooms`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: userId })
            });
            const data = await res.json();
            currentRoomId = data.room.id;
            await loadRooms();
            selectRoom(data.room.id, data.room.title);
        } catch (e) {
            console.error("새 방 생성 실패:", e);
        }
    }

    async function selectRoom(roomId, title) {
        currentRoomId = roomId;
        document.getElementById("current-room-title").innerText = title;
        await loadMessages(roomId);
        
        // 활성화된 방 스타일 적용
        const items = document.querySelectorAll('.room-item');
        items.forEach(item => item.classList.remove('active'));
        await loadRooms();
    }

    async function loadMessages(roomId) {
        try {
            const res = await fetch(`${BACKEND_URL}/api/messages/${roomId}`);
            const data = await res.json();
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = "";

            if (data.messages) {
                data.messages.forEach(msg => {
                    appendMessage(msg.content, msg.sender);
                });
            }
        } catch (e) {
            console.error("메시지 로드 실패:", e);
        }
    }

    function appendMessage(text, side) {
        const chatBox = document.getElementById("chat-box");
        const row = document.createElement("div");
        row.className = `msg-row ${side}`;
        
        const content = document.createElement("div");
        content.className = "msg-content";
        content.innerText = text;

        row.appendChild(content);
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        return content;
    }

    async function sendMessage() {
        const input = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const message = input.value.trim();

        if (!message || !currentRoomId) return;

        // 전송 중 중복 입력 방지
        input.value = "";
        input.disabled = true;
        sendBtn.disabled = true;

        appendMessage(message, "user");
        const loading = appendMessage("답변을 생각 중이에요... 💭", "bot");

        try {
            const res = await fetch(`${BACKEND_URL}/api/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ room_id: currentRoomId, message: message })
            });
            const data = await res.json();
            
            if (res.ok) {
                loading.innerText = data.answer;
                loadRooms(); // 질문 입력에 따른 채팅방 제목 자동 갱신
            } else {
                loading.innerText = "❌ 오류가 발생했습니다: " + (data.detail || "알 수 없는 오류");
            }
        } catch (e) {
            loading.innerText = "❌ 서버와 연결할 수 없습니다. (Render 서버가 준비 중일 수 있으니 잠시 후 다시 시도해 주세요)";
        } finally {
            // 입력창 상태 원복
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }
</script>
</body>
</html>
