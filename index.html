<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-chat: #0f172a;
            --bg-card: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        /* 사이드바 레이아웃 */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .btn-new-chat {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .room-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .room-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
        }
        .room-item:hover, .room-item.active { background-color: var(--bg-card); color: var(--text-main); }

        /* 메인 채팅 영역 */
        .main-chat { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        .chat-header {
            padding: 16px 20px;
            background-color: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toggle-sidebar { display: none; background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

        .msg-row { display: flex; gap: 12px; max-width: 80%; }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot { align-self: flex-start; }

        .msg-content {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .msg-row.bot .msg-content { background-color: var(--bg-card); }
        .msg-row.user .msg-content { background-color: var(--primary); }

        .input-container { padding: 16px 20px; background-color: var(--bg-sidebar); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .input-container input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: white; outline: none; }
        .input-container button { width: 44px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }

        /* 모바일 반응형 커스텀 */
        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .toggle-sidebar { display: block; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="btn-new-chat" onclick="createNewRoom()"><i class="fa-solid fa-plus"></i> 새 대화 시작</button>
        </div>
        <div class="room-list" id="room-list"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h3 id="current-room-title">채팅방을 선택하세요</h3>
        </div>

        <div class="chat-box" id="chat-box"></div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

<script>
    const BACKEND_URL = "https://my-ai-chat-bot.onrender.com"; // 본인 Render 백엔드 주소 입력
    
    // 유저 고유 ID 식별자 (모바일/PC 동기화를 원할 경우 이 아이디를 동일하게 세팅)
    let userId = localStorage.getItem("chat_user_id") || "user_" + Math.random().toString(36).substr(2, 9);
    localStorage.setItem("chat_user_id", userId);

    let currentRoomId = null;

    window.onload = async () => {
        await loadRooms();
    };

    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
    }

    async function loadRooms() {
        const res = await fetch(`${BACKEND_URL}/api/rooms/${userId}`);
        const data = await res.json();
        const roomList = document.getElementById("room-list");
        roomList.innerHTML = "";

        data.rooms.forEach(room => {
            const div = document.createElement("div");
            div.className = `room-item ${room.id === currentRoomId ? 'active' : ''}`;
            div.innerText = room.title;
            div.onclick = () => selectRoom(room.id, room.title);
            roomList.appendChild(div);
        });

        if (data.rooms.length > 0 && !currentRoomId) {
            selectRoom(data.rooms[0].id, data.rooms[0].title);
        }
    }

    async function createNewRoom() {
        const res = await fetch(`${BACKEND_URL}/api/rooms`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();
        await loadRooms();
        selectRoom(data.room.id, data.room.title);
    }

    async function selectRoom(roomId, title) {
        currentRoomId = roomId;
        document.getElementById("current-room-title").innerText = title;
        await loadMessages(roomId);
        loadRooms(); // 활성화 클래스(active) 갱신
    }

    async function loadMessages(roomId) {
        const res = await fetch(`${BACKEND_URL}/api/messages/${roomId}`);
        const data = await res.json();
        const chatBox = document.getElementById("chat-box");
        chatBox.innerHTML = "";

        data.messages.forEach(msg => {
            appendMessage(msg.content, msg.sender);
        });
    }

    function appendMessage(text, side) {
        const chatBox = document.getElementById("chat-box");
        const row = document.createElement("div");
        row.className = `msg-row ${side}`;
        
        const content = document.createElement("div");
        content.className = "msg-content";
        content.innerText = text;

        row.appendChild(content);
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        return content;
    }

    async function sendMessage() {
        const input = document.getElementById("user-input");
        const message = input.value.trim();
        if (!message || !currentRoomId) return;

        appendMessage(message, "user");
        input.value = "";
        const loading = appendMessage("답변을 생각 중이에요... 💭", "bot");

        try {
            const res = await fetch(`${BACKEND_URL}/api/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ room_id: currentRoomId, message: message })
            });
            const data = await res.json();
            if (res.ok) {
                loading.innerText = data.answer;
                loadRooms(); // 생성된 제목 갱신
            } else {
                loading.innerText = "❌ 오류가 발생했습니다.";
            }
        } catch (e) {
            loading.innerText = "❌ 연결할 수 없습니다.";
        }
    }
</script>
</body>
</html>
